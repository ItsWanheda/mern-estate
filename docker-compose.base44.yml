services:
  mongo:
    image: mongo:7
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: estatedevpass
      MONGO_INITDB_DATABASE: mern-estate
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./:/app
      - api-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: debug
      MONGO: mongodb://root:estatedevpass@mongo:27017/mern-estate?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-replace-in-production-at-least-32-chars-long
      JWT_EXPIRES_IN: 7d
      TRUST_PROXY: "0"
      CORS_ORIGINS: ""
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-ec", "npm ci && exec npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app/client
    volumes:
      - ./:/app
      - web-node-modules:/app/client/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    env_file:
      - /run/base44/app.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm ci && exec npm run dev -- --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mongo-data:
  api-node-modules:
  web-node-modules:
